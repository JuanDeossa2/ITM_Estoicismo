server:
  port: 8084

# datos para el ORM JPA, conexión a MySql
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/itm_estoicismo_db
    username: root
    password: admin123
    driverClassName: com.mysql.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true